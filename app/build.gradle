plugins {
    id 'com.android.application'
}

// Release signing: put your keystore details in keystore.properties (see keystore.properties.example).
// That file and the .jks are in .gitignore and must never be committed.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.filmipaheli.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.filmipaheli.app"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
        // Where new films are downloaded from. Needs a public link to a JSON file like puzzles.json.
        buildConfigField "String", "CONTENT_URL", "\"https://raw.githubusercontent.com/priyankasinghal31/FilmiPaheli/main/app/src/main/assets/puzzles.json\""
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    // Keep every language in the bundle. The in-app English/Hindi switch needs both on every phone.
    bundle {
        language {
            enableSplit = false
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            // Google's public TEST ids: safe to tap while developing.
            manifestPlaceholders = [admobAppId: "ca-app-pub-3940256099942544~3347511713"]
            buildConfigField "String", "REWARDED_ID", "\"ca-app-pub-3940256099942544/5224354917\""
        }
        release {
            // Your real AdMob ids. Release builds only.
            manifestPlaceholders = [admobAppId: "ca-app-pub-1510739602043175~3609227386"]
            buildConfigField "String", "REWARDED_ID", "\"ca-app-pub-1510739602043175/5353408105\""
            minifyEnabled true
            shrinkResources true
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.work:work-runtime:2.9.0'
    // WorkManager's Worker needs ListenableFuture to compile.
    implementation 'com.google.guava:guava:32.1.3-android'
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
}
